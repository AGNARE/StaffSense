<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Риски увольнений — StaffSense</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
    <div class="brand">
        <span class="logo">S</span>
        <div>
            <div class="brand-title">StaffSense</div>
            <div class="brand-sub">Риски увольнений</div>
        </div>
    </div>

    <div class="topbar-right">
        <span class="pill" id="thresholds-pill" title="Действующие пороги уровней">пороги: —</span>
        <button class="btn" id="refresh" type="button">Обновить</button>
        <a class="btn btn-ghost" href="/risk">Старый интерфейс</a>
    </div>
</header>

<main class="wrap">
    <section class="stats" id="stats" aria-label="Сводка">
        <div class="stat"><div class="stat-value" id="stat-total">—</div><div class="stat-label">сотрудников</div></div>
        <div class="stat"><div class="stat-value danger" id="stat-high">—</div><div class="stat-label">высокий риск</div></div>
        <div class="stat"><div class="stat-value warning" id="stat-medium">—</div><div class="stat-label">средний риск</div></div>
        <div class="stat"><div class="stat-value success" id="stat-low">—</div><div class="stat-label">низкий риск</div></div>
        <div class="stat"><div class="stat-value" id="stat-unknown">—</div><div class="stat-label">без прогноза</div></div>
    </section>

    <section class="panel">
        <div class="panel-head">
            <h2>Список сотрудников</h2>
            <div class="panel-tools">
                <input type="search" id="search" placeholder="Поиск по имени или отделу" aria-label="Поиск">
                <select id="level-filter" aria-label="Фильтр по уровню">
                    <option value="">Все уровни</option>
                    <option value="HIGH">Высокий</option>
                    <option value="MEDIUM">Средний</option>
                    <option value="LOW">Низкий</option>
                    <option value="UNKNOWN">Без прогноза</option>
                </select>
            </div>
        </div>

        <div class="table-wrap">
            <table class="table">
                <thead>
                <tr>
                    <th>Сотрудник</th>
                    <th>Отдел / должность</th>
                    <th class="num">Риск</th>
                    <th>Уровень</th>
                    <th>Последний расчёт</th>
                </tr>
                </thead>
                <tbody id="rows">
                <tr><td colspan="5" class="empty">Загрузка…</td></tr>
                </tbody>
            </table>
        </div>

        <div class="pager" id="pager">
            <button class="btn btn-ghost" id="prev" type="button">Назад</button>
            <span id="page-info" class="muted">—</span>
            <button class="btn btn-ghost" id="next" type="button">Вперёд</button>
        </div>
    </section>
</main>

<aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
        <div>
            <h2 id="drawer-title">—</h2>
            <div class="muted" id="drawer-sub">—</div>
        </div>
        <button class="btn btn-ghost" id="drawer-close" type="button" aria-label="Закрыть">✕</button>
    </div>

    <div class="drawer-body">
        <div class="drawer-score">
            <div class="score-big" id="drawer-score">—</div>
            <div class="badge" id="drawer-level">—</div>
        </div>

        <div class="trend-block">
            <div class="trend-head">
                <h3>Динамика риска</h3>
                <span class="badge" id="drawer-delta">—</span>
            </div>
            <svg id="drawer-chart" viewBox="0 0 240 56" preserveAspectRatio="none" aria-label="График риска">
                <line x1="0" y1="6" x2="240" y2="6" class="grid-line"></line>
                <line x1="0" y1="50" x2="240" y2="50" class="grid-line"></line>
                <polyline id="drawer-polyline" points="" class="trend-line"></polyline>
                <g id="drawer-dots"></g>
            </svg>
            <div class="trend-foot muted" id="drawer-trend-foot">—</div>
        </div>

        <h3>Признаки</h3>
        <div id="drawer-features" class="features"></div>

        <h3>Факторы риска</h3>
        <div id="drawer-factors" class="factors"></div>
    </div>
</aside>

<div class="backdrop" id="backdrop"></div>

<script src="app.js"></script>
</body>
</html>
