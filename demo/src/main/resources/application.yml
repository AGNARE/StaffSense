server:
  port: 9091
  servlet:
    session:
      timeout: 30m

spring:
  application:
    name: StaffSense
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/db_staff_sense}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    # Секрет не хранится в репозитории. Обязательно задайте SPRING_DATASOURCE_PASSWORD
    # для PostgreSQL. Для H2 переменная не требуется.
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      # Схема управляется миграциями Flyway. validate гарантирует, что схема БД
      # соответствует JPA-сущностям, и не даёт Hibernate менять её «на лету».
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  # Миграции схемы (NFR-024). Для режима H2 задайте FLYWAY_ENABLED=false
  # и SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop.
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # Существующая БД помечается как baseline v1, после чего применяются V2+.
    baseline-on-migrate: true
    baseline-version: 1
  jackson:
    serialization:
      fail-on-empty-beans: false
  # Кэш разобранных Thymeleaf-шаблонов. В продакшене — true (быстрее).
  # При локальной разработке задайте SPRING_THYMELEAF_CACHE=false: devtools
  # в проект не подключён, поэтому при кэше правки в templates/*.html
  # не видны до перезапуска приложения — именно так «исправленная» страница
  # ошибки продолжала падать в уже запущенном процессе.
  thymeleaf:
    cache: ${SPRING_THYMELEAF_CACHE:true}

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8001/api/v1/predict}
    # FR-018: коэффициенты действующей модели для страницы ML-модели.
    # Раньше веса были захардкожены в ModelInsightService и не совпадали
    # с обученной моделью; теперь берутся из ML-сервиса.
    model-info-url: ${ML_SERVICE_MODEL_INFO_URL:http://localhost:8001/api/v1/model-info}
    # Кэш весов: страница не должна ждать ML-сервис при каждой отрисовке.
    model-info-cache-ms: ${ML_SERVICE_MODEL_INFO_CACHE_MS:60000}
    connect-timeout-ms: ${ML_SERVICE_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ML_SERVICE_READ_TIMEOUT_MS:2000}

kpi:
  weights:
    on-time: 0.5
    reopen: 0.2
    manager-rating: 0.3

risk:
  thresholds:
    # BR-007: единственный источник порогов уровня риска.
    # Читается RiskThresholdProperties (@ConfigurationProperties) и используется
    # в AttritionMlService, DataInitializer и DatasetGenerator.
    # low — граница LOW/MEDIUM, medium — граница MEDIUM/HIGH.
    low: ${RISK_THRESHOLD_LOW:33}
    medium: ${RISK_THRESHOLD_HIGH:66}

staffsense:
  dataset:
    # Генерация синтетического датасета (dataset_training.csv / dataset_test.csv)
    # при старте приложения. Отключено в тестах (application-test.yml).
    generate-on-startup: ${DATASET_GENERATE_ON_STARTUP:true}
    output-dir: ${DATASET_OUTPUT_DIR:.}
  oneonone:
    # Расписание автопометки пропущенных встреч 1:1 (FR-026, BR-021).
    # По умолчанию — ежедневно в 03:00.
    missed-cron: ${ONEONONE_MISSED_CRON:0 0 3 * * *}