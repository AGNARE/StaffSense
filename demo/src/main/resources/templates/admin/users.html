<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Панель управления — Пользователи')}"></head>
<body>
    <div class="app-container">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>

        <main class="main-content">
            <div class="topbar flex-between">
                <h1 class="page-title">Панель управления — Пользователи</h1>
                <a th:href="@{/admin/users/new}" class="btn btn-primary">
                    <i class='bx bx-plus'></i> Создать пользователя
                </a>
            </div>

            <!-- Flash messages -->
            <div th:if="${success}" class="alert alert-success animate-fade-in">
                <i class='bx bx-check-circle'></i>
                <span th:text="${success}">Success</span>
            </div>
            <div th:if="${error}" class="alert alert-danger animate-fade-in">
                <i class='bx bx-error-circle'></i>
                <span th:text="${error}">Error</span>
            </div>

            <div class="glass-card animate-fade-in mb-4">
                <form th:action="@{/admin}" method="get" class="flex-between">
                    <div style="display: flex; gap: 1rem; align-items: center; flex: 1; max-width: 500px;">
                        <label for="role" class="text-muted m-0">Роль:</label>
                        <select name="role" id="role" class="form-control" style="width: 200px;">
                            <option value="">Все роли</option>
                            <option value="ADMIN" th:selected="${selectedRole == 'ADMIN'}">ADMIN</option>
                            <option value="HR" th:selected="${selectedRole == 'HR'}">HR</option>
                            <option value="PM" th:selected="${selectedRole == 'PM'}">PM</option>
                            <option value="EXEC" th:selected="${selectedRole == 'EXEC'}">EXEC</option>
                            <option value="EMPLOYEE" th:selected="${selectedRole == 'EMPLOYEE'}">EMPLOYEE</option>
                        </select>
                        <button type="submit" class="btn btn-primary">Фильтр</button>
                    </div>
                </form>
            </div>

            <div class="glass-card animate-fade-in delay-1">
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Имя</th>
                                <th>Email</th>
                                <th>Роль</th>
                                <th>Отдел</th>
                                <th>Активен</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td>
                                    <div class="user-profile-sm">
                                        <div class="avatar" th:text="${#strings.substring(user.fullName,0,1)}">A</div>
                                        <span class="name" th:text="${user.fullName}">Name</span>
                                    </div>
                                </td>
                                <td th:text="${user.email}">email@</td>
                                <td><span class="badge badge-info" th:text="${user.role.name()}">ROLE</span></td>
                                <td th:text="${user.department}">Dept</td>
                                <td>
                                    <span th:if="${user.active}" style="color: var(--success-color);">
                                        <i class='bx bx-check-circle'></i> Да
                                    </span>
                                    <span th:unless="${user.active}" style="color: var(--danger-color);">
                                        <i class='bx bx-x-circle'></i> Нет
                                    </span>
                                </td>
                                <td>
                                    <form th:action="@{/admin/users/{id}/toggle-active(id=${user.id})}" method="post" style="display: inline;">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <button type="submit" class="btn btn-sm"
                                                th:classappend="${user.active ? 'btn-warning' : 'btn-success'}"
                                                th:disabled="${user.id == currentUser.id}"
                                                th:title="${user.id == currentUser.id} ? 'Вы не можете отключить себя' : ''">
                                            <i th:classappend="${user.active ? 'bx bx-lock' : 'bx bx-unlock'}" class='bx'></i>
                                            <span th:text="${user.active} ? 'Деактивировать' : 'Активировать'">Toggle</span>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div th:if="${userPage.totalPages > 1}" class="pagination-controls">
                    <div class="pagination-info text-sm text-muted mb-2">
                        Показано <span th:text="${userPage.number * userPage.size + 1}">1</span>–
                        <span th:text="${(userPage.number * userPage.size) + userPage.size}">10</span>
                        из <span th:text="${userPage.totalElements}">N</span>
                    </div>
                    <div class="pagination-links">
                        <a th:if="${userPage.hasPrevious()}"
                           th:href="@{/admin(page=${userPage.number - 1}, size=20, role=${selectedRole})}"
                           class="btn btn-secondary pagination-btn">
                            <i class='bx bx-chevron-left'></i> Назад
                        </a>

                        <span th:each="i : ${#numbers.sequence(0, userPage.totalPages - 1)}">
                            <a th:href="@{/admin(page=${i}, size=20, role=${selectedRole})}"
                               th:classappend="${i == userPage.number} ? 'active' : ''"
                               class="pagination-page-btn"
                               th:text="${i + 1}">1</a>
                        </span>

                        <a th:if="${userPage.hasNext()}"
                           th:href="@{/admin(page=${userPage.number + 1}, size=20, role=${selectedRole})}"
                           class="btn btn-secondary pagination-btn">
                            Вперёд <i class='bx bx-chevron-right'></i>
                        </a>
                    </div>
                </div>
            </div>

        </main>
    </div>
</body>
</html>
