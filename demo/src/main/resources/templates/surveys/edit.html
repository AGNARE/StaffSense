<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Редактирование опроса')}"></head>
<body>
    <div class="app-container">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>

        <main class="main-content">
            <div class="mb-4">
                <a th:href="@{/surveys/manage}" class="text-muted"><i class='bx bx-arrow-back'></i> Назад к списку опросов</a>
            </div>

            <div class="topbar">
                <h1 class="page-title">Редактирование опроса</h1>
                <span th:class="'badge badge-' + (${survey.status.name() == 'DRAFT'} ? 'medium' : 'danger')" th:text="${survey.status}">STATUS</span>
            </div>

            <div th:if="${survey.status.name() != 'DRAFT'}" class="alert alert-warning animate-fade-in">
                <i class='bx bx-info-circle'></i>
                Опрос уже <strong th:text="${survey.status.name() == 'ACTIVE' ? 'активен' : 'закрыт'}"></strong>.
                Редактирование возможно только для черновиков.
            </div>

            <div class="glass-card animate-fade-in" style="max-width: 800px;">
                <form th:action="@{/surveys/manage/{id}/edit(id=${survey.id})}" method="post" id="surveyForm">
                    <!-- Название -->
                    <div class="form-group">
                        <label class="form-label" for="title">Название опроса</label>
                        <input type="text" id="title" name="title" class="form-control" required
                               th:value="${survey.title}" placeholder="Например: Удовлетворённость командой Q3"
                               th:disabled="${survey.status.name() != 'DRAFT'}">
                    </div>

                    <!-- Тип опроса (readonly) -->
                    <div class="form-group">
                        <label class="form-label" for="surveyType">Тип опроса</label>
                        <select id="surveyType" name="surveyType" class="form-control" required disabled>
                            <option th:each="st : ${surveyTypes}" th:value="${st.name()}" th:selected="${survey.surveyType.name() == st.name()}" th:text="${st.name()}">TYPE</option>
                        </select>
                        <input type="hidden" name="surveyType" th:value="${survey.surveyType.name()}">
                    </div>

                    <!-- Целевая аудитория -->
                    <div class="grid-2">
                        <div class="form-group">
                            <label class="form-label" for="targetScope">Целевая аудитория</label>
                            <select id="targetScope" name="targetScope" class="form-control" required
                                    th:disabled="${survey.status.name() != 'DRAFT'}"
                                    onchange="onScopeChange()">
                                <option th:each="scope : ${scopes}" th:value="${scope.name()}" th:selected="${survey.targetScope.name() == scope.name()}" th:text="${scope.name()}">SCOPE</option>
                            </select>
                        </div>

                        <div class="form-group" style="display: flex; align-items: flex-end;">
                            <label class="form-label" style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                <input type="checkbox" name="isAnonymous" value="true" style="width:18px;height:18px;"
                                       th:checked="${survey.anonymous}"
                                       th:disabled="${survey.status.name() != 'DRAFT'}">
                                Анонимные ответы
                            </label>
                        </div>
                    </div>

                    <!-- Параметры охвата (DEPARTMENT / TEAM / INDIVIDUAL) -->
                    <div id="extraTargetFields">
                        <div class="form-group" id="departmentField" style="display: none;">
                            <label class="form-label" for="targetDepartment">Отдел</label>
                            <select id="targetDepartment" name="targetDepartment" class="form-control">
                                <option value="">-- Выберите отдел --</option>
                                <option th:each="dept : ${departments}" th:value="${dept}"
                                        th:selected="${survey.targetDepartment != null and survey.targetDepartment == dept}"
                                        th:text="${dept}">Department</option>
                            </select>
                        </div>
                        <div class="form-group" id="managerField" style="display: none;">
                            <label class="form-label" for="targetManagerId">Руководитель</label>
                            <select id="targetManagerId" name="targetManagerId" class="form-control">
                                <option value="">-- Выберите руководителя --</option>
                                <option th:each="mgr : ${managers}" th:value="${mgr.id}"
                                        th:selected="${survey.targetManagerId != null and survey.targetManagerId == mgr.id}"
                                        th:text="${mgr.fullName} + ' (' + ${mgr.email} + ')'">Manager</option>
                            </select>
                        </div>
                        <div class="form-group" id="individualField" style="display: none;">
                            <label class="form-label" for="targetUserId">Сотрудник</label>
                            <select id="targetUserId" name="targetUserId" class="form-control">
                                <option value="">-- Выберите сотрудника --</option>
                                <option th:each="emp : ${employees}" th:value="${emp.id}"
                                        th:selected="${survey.targetUserId != null and survey.targetUserId == emp.id}"
                                        th:text="${emp.fullName} + ' (' + ${emp.email} + ')'">Employee</option>
                            </select>
                        </div>
                    </div>

                    <!-- Даты -->
                    <div class="grid-2">
                        <div class="form-group">
                            <label class="form-label" for="startDate">Дата начала</label>
                            <input type="date" id="startDate" name="startDate" class="form-control" required
                                   th:value="${#temporals.format(survey.startDate, 'yyyy-MM-dd')}"
                                   th:disabled="${survey.status.name() != 'DRAFT'}">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="endDate">Дата окончания</label>
                            <input type="date" id="endDate" name="endDate" class="form-control" required
                                   th:value="${#temporals.format(survey.endDate, 'yyyy-MM-dd')}"
                                   th:disabled="${survey.status.name() != 'DRAFT'}">
                        </div>
                    </div>

                    <!-- --- ВОПРОСЫ --- -->
                    <hr class="my-4">
                    <h3 class="mb-3" style="font-size: 1.1rem;">
                        <i class='bx bx-list-ul'></i> Вопросы опроса
                    </h3>

                    <div th:if="${survey.status.name() == 'DRAFT'}" class="alert alert-info mb-3">
                        <i class='bx bx-info-circle'></i>
                        Вы можете изменить или переупорядочить вопросы. Все старые вопросы будут заменены.
                    </div>

                    <div id="questionsContainer">
                        <div th:each="q, iter : ${questions}" th:remove="tag">
                            <div class="question-item" th:id="'q_' + ${iter.index}" style="background: var(--bg-secondary); border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem;">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                                    <strong style="font-size: 0.85rem;" th:text="'Вопрос #' + (iter.index + 1)">#1</strong>
                                    <button th:if="${survey.status.name() == 'DRAFT'}" type="button" class="btn btn-danger btn-sm" th:onclick="'removeQuestion(' + ${iter.index} + ')'" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;">
                                        <i class="bx bx-x"></i> Удалить
                                    </button>
                                </div>
                                <div class="grid-2" style="gap: 0.75rem; align-items: start;">
                                    <div class="form-group" style="margin-bottom: 0;">
                                        <select name="questionType" class="form-control" style="font-size: 0.85rem;" th:disabled="${survey.status.name() != 'DRAFT'}">
                                            <option value="LIKERT_5" th:selected="${q.type.name() == 'LIKERT_5'}">Оценка 1-5 (LIKERT)</option>
                                            <option value="FREE_TEXT" th:selected="${q.type.name() == 'FREE_TEXT'}">Свободный ответ</option>
                                        </select>
                                    </div>
                                    <div class="form-group" style="margin-bottom: 0;">
                                        <input type="text" name="questionText" class="form-control" placeholder="Текст вопроса" style="font-size: 0.85rem;"
                                               th:value="${q.text}" required
                                               th:disabled="${survey.status.name() != 'DRAFT'}">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Add question button -->
                    <button th:if="${survey.status.name() == 'DRAFT'}" type="button" class="btn btn-secondary btn-sm" onclick="addQuestion()">
                        <i class='bx bx-plus'></i> Добавить вопрос
                    </button>

                    <div class="mt-4 pt-4 flex-between" style="border-top: 1px solid var(--glass-border);">
                        <a th:href="@{/surveys/manage}" class="btn btn-secondary">Отмена</a>
                        <button th:if="${survey.status.name() == 'DRAFT'}" type="submit" class="btn btn-primary">
                            <i class='bx bx-save'></i> Сохранить изменения
                        </button>
                    </div>
                </form>
            </div>

            <!-- Навигация -->
            <div class="mt-3" style="display: flex; gap: 0.5rem;">
                <a th:href="@{/surveys/manage/{id}/results(id=${survey.id})}" class="btn btn-info">
                    <i class='bx bx-bar-chart-alt-2'></i> Результаты опроса
                </a>
            </div>
        </main>
    </div>

    <script>
    let questionCounter = [[${questions != null ? questions.size() : 0}]];

    function addQuestion() {
        const container = document.getElementById('questionsContainer');
        const idx = questionCounter++;
        const div = document.createElement('div');
        div.className = 'question-item';
        div.id = 'q_' + idx;
        div.style.cssText = 'background: var(--bg-secondary); border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem;';

        div.innerHTML = '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">' +
            '<strong style="font-size: 0.85rem;">Вопрос #' + (idx + 1) + '</strong>' +
            '<button type="button" class="btn btn-danger btn-sm" onclick="removeQuestion(' + idx + ')" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;">' +
            '<i class="bx bx-x"></i> Удалить</button></div>' +
            '<div class="grid-2" style="gap: 0.75rem; align-items: start;">' +
            '<div class="form-group" style="margin-bottom: 0;">' +
            '<select name="questionType" class="form-control" style="font-size: 0.85rem;" required>' +
            '<option value="LIKERT_5">Оценка 1-5 (LIKERT)</option>' +
            '<option value="FREE_TEXT">Свободный ответ</option>' +
            '</select></div>' +
            '<div class="form-group" style="margin-bottom: 0;">' +
            '<input type="text" name="questionText" class="form-control" placeholder="Текст вопроса" style="font-size: 0.85rem;" required></div>' +
            '</div>';

        container.appendChild(div);
    }

    function removeQuestion(idx) {
        const el = document.getElementById('q_' + idx);
        if (el) el.remove();
    }

    // Показ полей охвата в зависимости от выбранного значения scope.
    // Ранее onchange="onScopeChange()" вызывал несуществующую функцию.
    function onScopeChange() {
        const scope = document.getElementById('targetScope').value;
        document.getElementById('departmentField').style.display = scope === 'DEPARTMENT' ? 'block' : 'none';
        document.getElementById('managerField').style.display = scope === 'TEAM' ? 'block' : 'none';
        document.getElementById('individualField').style.display = scope === 'INDIVIDUAL' ? 'block' : 'none';
    }

    document.addEventListener('DOMContentLoaded', onScopeChange);

    // Form validation
    document.getElementById('surveyForm').addEventListener('submit', function(e) {
        const texts = document.querySelectorAll('input[name="questionText"]');
        const filled = Array.from(texts).filter(t => t.value.trim());
        if (filled.length === 0) {
            e.preventDefault();
            alert('Добавьте хотя бы один вопрос для опроса.');
        }
    });
    </script>
</body>
</html>
