<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Подать записку')}"></head>
<body>
<div class="app-container">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="main-content">
        <div class="mb-4">
            <a th:href="@{/memos}" class="text-muted"><i class='bx bx-arrow-back'></i> К запискам</a>
        </div>

        <div class="topbar">
            <h1 class="page-title">Подать служебную записку</h1>
        </div>

        <div th:if="${error}" class="alert alert-error animate-fade-in"><span th:text="${error}"></span></div>

        <form method="post" th:action="@{/memos/new}" class="glass-card animate-fade-in">
            <p class="text-muted text-sm">
                Записку может подать любой сотрудник. После подачи она направляется
                на визу руководителю, затем на утверждение в HR.
            </p>

            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label" for="memoType">Тип записки</label>
                    <select id="memoType" name="memoType" class="form-control" required>
                        <option th:each="t : ${types}" th:value="${t}" th:text="${t.title}">Тип</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="startDate">Дата начала</label>
                    <input type="date" id="startDate" name="startDate" class="form-control" required
                           th:value="${#temporals.format(today, 'yyyy-MM-dd')}">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label" for="endDate">Дата окончания</label>
                    <input type="date" id="endDate" name="endDate" class="form-control" required
                           th:value="${#temporals.format(today, 'yyyy-MM-dd')}">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="reason">Обоснование</label>
                <textarea id="reason" name="reason" class="form-control" rows="5"
                          placeholder="Кратко опишите причину"></textarea>
            </div>

            <button type="submit" class="btn btn-primary"><i class='bx bx-send'></i> Подать</button>
            <a th:href="@{/memos}" class="btn btn-secondary">Отмена</a>
        </form>
    </main>
</div>
</body>
</html>
