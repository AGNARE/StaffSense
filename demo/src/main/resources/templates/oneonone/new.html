<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Запланировать встречу')}"></head>
<body>
    <div class="app-container">
        <aside th:replace="~{fragments/layout :: sidebar}"></aside>
        
        <main class="main-content">
            <div class="mb-4">
                <a th:href="@{/oneonone}" class="text-muted"><i class='bx bx-arrow-back'></i> Назад к списку встреч</a>
            </div>
            
            <div class="topbar">
                <h1 class="page-title">Запланировать 1:1</h1>
            </div>
            
            <div class="glass-card animate-fade-in" style="max-width: 600px;">
                <form th:action="@{/oneonone/new}" method="post">
                    
                    <div class="form-group">
                        <label class="form-label" for="employeeId">Выберите сотрудника</label>
                        <select id="employeeId" name="employeeId" class="form-control" required>
                            <option value="">-- Выберите сотрудника --</option>
                            <option th:each="emp : ${employees}" th:value="${emp.id}" th:text="${emp.fullName} + ' (' + ${emp.position} + ')'">Emp</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="scheduledAt">Дата и время встречи</label>
                        <input type="datetime-local" id="scheduledAt" name="scheduledAt" class="form-control" required>
                    </div>
                    
                    <div class="mt-4 pt-4 flex-between" style="border-top: 1px solid var(--glass-border);">
                        <a th:href="@{/oneonone}" class="btn btn-secondary">Отмена</a>
                        <button type="submit" class="btn btn-primary"><i class='bx bx-calendar-check'></i> Сохранить</button>
                    </div>
                </form>
            </div>
            
        </main>
    </div>
</body>
</html>
