<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ошибка')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <!--
      Одна и та же страница рендерится двумя путями:
        1) GlobalControllerAdvice#errorView — задаёт errorTitle/errorMessage;
        2) BasicErrorController (/error: 404 на статику, 403 от фильтров безопасности) —
           он кладёт в модель только status/error/message.
      Поэтому заголовок и описание вычисляются с запасным вариантом по коду статуса,
      иначе на втором пути страница была бы пустой.
    -->
    <main class="main-content"
          th:with="title=${errorTitle != null
                            ? errorTitle
                            : (status == 404 ? 'Страница не найдена'
                            : status == 403 ? 'Доступ запрещён'
                            : status == 400 ? 'Неверный запрос'
                            : status == 409 ? 'Конфликт данных'
                            : 'Ошибка')},
                   description=${errorMessage != null
                            ? errorMessage
                            : (status == 404 ? 'Запрашиваемый ресурс не существует или был удалён.'
                            : status == 403 ? 'У вас нет прав для просмотра этой страницы.'
                            : 'Произошла непредвиденная ошибка. Пожалуйста, попробуйте позже.')}">
        <div class="page-header">
            <h1 th:text="${title}">Ошибка</h1>
        </div>

        <div class="error-card animate-fade-in">
            <div class="error-icon" th:classappend="|error-${status}|">
                <i class='bx' th:classappend="${status == 403 ? 'bx-lock' : status == 404 ? 'bx-search' : status == 400 ? 'bx-error' : 'bx-bug'}" ></i>
            </div>
            <div class="error-code" th:text="|${status}|">500</div>
            <h2 class="error-message" th:text="${title}">Внутренняя ошибка</h2>
            <p class="error-description text-muted" th:text="${description}">Описание ошибки</p>
            <div class="error-actions mt-4">
                <a th:href="@{/dashboard}" class="btn btn-primary">
                    <i class='bx bxs-dashboard'></i> На дашборд
                </a>
                <a href="javascript:history.back()" class="btn btn-secondary">
                    <i class='bx bx-arrow-back'></i> Назад
                </a>
            </div>
        </div>
    </main>

    <style>
        .error-card {
            text-align: center;
            padding: 3rem 2rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            backdrop-filter: blur(var(--glass-blur));
            max-width: 520px;
            margin: 2rem auto;
        }
        .error-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: var(--text-muted);
        }
        .error-icon.error-403 { color: #f59e0b; }
        .error-icon.error-404 { color: var(--accent-primary); }
        .error-icon.error-400 { color: #f97316; }
        .error-icon.error-500 { color: #ef4444; }
        .error-code {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .error-message {
            font-size: 1.35rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        .error-description {
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .error-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
        }
    </style>
</body>
</html>
