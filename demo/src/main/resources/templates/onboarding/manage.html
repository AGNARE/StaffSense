<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Управление порталом')}"></head>
<body>
<div class="app-container">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="main-content">
        <div class="topbar">
            <h1 class="page-title">Управление порталом онбординга</h1>
            <a th:href="@{/onboarding/manage/new}" class="btn btn-primary">
                <i class='bx bx-plus'></i> Новая статья
            </a>
        </div>

        <div th:if="${success}" class="alert alert-success animate-fade-in"><span th:text="${success}"></span></div>
        <div th:if="${info}" class="alert animate-fade-in"><span th:text="${info}"></span></div>

        <div class="glass-card animate-fade-in">
            <div th:if="${#lists.isEmpty(articles)}" class="text-muted py-3">
                Статей пока нет. Создайте первую.
            </div>

            <table th:unless="${#lists.isEmpty(articles)}" style="width: 100%; border-collapse: collapse;">
                <thead>
                <tr style="text-align: left; color: var(--text-muted); font-size: 0.85rem;">
                    <th class="pb-2">Раздел</th>
                    <th class="pb-2">Заголовок</th>
                    <th class="pb-2">Порядок</th>
                    <th class="pb-2">Статус</th>
                    <th class="pb-2"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${articles}" style="border-top: 1px solid var(--glass-border);">
                    <td class="py-2"><span class="badge badge-medium" th:text="${a.section.title}">Раздел</span></td>
                    <td class="py-2">
                        <a th:href="@{/onboarding/article/{id}(id=${a.id})}" class="text-primary"
                           th:text="${a.title}">Заголовок</a>
                    </td>
                    <td class="py-2" th:text="${a.orderIndex}">0</td>
                    <td class="py-2">
                        <span th:if="${a.published}" class="badge badge-low">Опубликовано</span>
                        <span th:unless="${a.published}" class="badge badge-high">Черновик</span>
                    </td>
                    <td class="py-2" style="text-align: right; white-space: nowrap;">
                        <a th:href="@{/onboarding/manage/{id}/edit(id=${a.id})}" class="btn btn-secondary"
                           style="padding: 0.25rem 0.6rem; font-size: 0.8rem;">
                            <i class='bx bx-edit'></i>
                        </a>
                        <form th:action="@{/onboarding/manage/{id}/delete(id=${a.id})}" method="post"
                              style="display: inline;">
                            <button type="submit" class="btn btn-danger"
                                    style="padding: 0.25rem 0.6rem; font-size: 0.8rem;"
                                    onclick="return confirm('Удалить статью?');">
                                <i class='bx bx-trash'></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
