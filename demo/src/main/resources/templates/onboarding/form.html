<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Статья портала')}"></head>
<body>
<div class="app-container">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="main-content">
        <div class="mb-4">
            <a th:href="@{/onboarding/manage}" class="text-muted"><i class='bx bx-arrow-back'></i> К управлению</a>
        </div>

        <div class="topbar">
            <h1 class="page-title" th:text="${mode == 'create'} ? 'Новая статья' : 'Редактирование статьи'">Статья</h1>
        </div>

        <form method="post"
              th:action="${mode == 'create'} ? @{/onboarding/manage/new} : @{/onboarding/manage/{id}/edit(id=${article.id})}"
              th:object="${article}" class="glass-card animate-fade-in">

            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label" for="section">Раздел</label>
                    <select id="section" th:field="*{section}" class="form-control" required>
                        <option value="">— выберите —</option>
                        <option th:each="s : ${sections}" th:value="${s}" th:text="${s.title}">Раздел</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="orderIndex">Порядок вывода</label>
                    <input type="number" id="orderIndex" th:field="*{orderIndex}" class="form-control" min="0">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="title">Заголовок</label>
                <input type="text" id="title" th:field="*{title}" class="form-control" maxlength="200" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="content">Содержимое</label>
                <textarea id="content" th:field="*{content}" class="form-control" rows="14"
                          placeholder="Текст статьи. Переносы строк сохраняются."></textarea>
            </div>

            <div class="form-group">
                <label class="form-label" style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox" th:field="*{published}" style="width:18px;height:18px;">
                    Опубликовано (видно сотрудникам)
                </label>
            </div>

            <div>
                <button type="submit" class="btn btn-primary">
                    <i class='bx bx-save'></i> Сохранить
                </button>
                <a th:href="@{/onboarding/manage}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
