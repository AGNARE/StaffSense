<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${section.title})}"></head>
<body>
<div class="app-container">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="main-content">
        <div class="mb-4">
            <a th:href="@{/onboarding}" class="text-muted"><i class='bx bx-arrow-back'></i> К порталу</a>
        </div>

        <div class="topbar">
            <h1 class="page-title" th:text="${section.title}">Раздел</h1>
        </div>

        <div th:if="${#lists.isEmpty(articles)}" class="glass-card">
            <div class="text-center py-5">
                <i class='bx bx-book-open text-muted' style="font-size: 4rem;"></i>
                <h3 class="mt-3">В этом разделе пока нет материалов</h3>
            </div>
        </div>

        <div th:unless="${#lists.isEmpty(articles)}">
            <div th:each="a : ${articles}" class="glass-card mb-3 animate-fade-in">
                <h3 class="mb-2">
                    <a th:href="@{/onboarding/article/{id}(id=${a.id})}"
                       class="text-primary" th:text="${a.title}">Заголовок</a>
                </h3>
                <p class="text-muted mb-0" th:text="${a.summary}">Краткое описание</p>
            </div>
        </div>
    </main>
</div>
</body>
</html>
