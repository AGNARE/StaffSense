spring:
  datasource:
    url: jdbc:h2:mem:db_staff_sense;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: false
  # Тесты идут на H2 с create-drop: миграции Flyway написаны под PostgreSQL
  # (ALTER TABLE ONLY, GENERATED ... AS IDENTITY) и на H2 не применимы.
  flyway:
    enabled: false

# В тестах не генерируем CSV: ранее каждый прогон тестов перезаписывал
# dataset_training.csv / dataset_test.csv в рабочем каталоге.
staffsense:
  dataset:
    generate-on-startup: false
