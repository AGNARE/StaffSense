site_name: StaffSense
site_description: HR-Tech платформа для прогнозирования риска увольнения сотрудников
site_url: https://agnare.github.io/StaffSense/
repo_url: https://github.com/AGNARE/StaffSense
repo_name: AGNARE/StaffSense

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Переключить на тёмную тему
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.top
    - search.suggest

nav:
  - Главная: index.md
  - Архитектура: architecture.md
  - Быстрый старт: setup/quickstart.md
  - Конфигурация: setup/configuration.md
  - База данных: setup/database.md
  - Справочник API:
    - Обзор: api/overview.md
    - Аутентификация: api/authentication.md
    - Сотрудники: api/employees.md
    - Опросы: api/surveys.md
    - Аналитика: api/analytics.md
  - Развёртывание: deployment.md

plugins:
  - search

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
