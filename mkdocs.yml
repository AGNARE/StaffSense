site_name: StaffSense
site_description: HR-Tech платформа для прогнозирования риска увольнения сотрудников
site_url: https://agnare.github.io/StaffSense/
repo_url: https://github.com/AGNARE/StaffSense
repo_name: AGNARE/StaffSense

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Переключить на тёмную тему
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.top
    - search.suggest

nav:
  - Главная: index.md
  - Архитектура: architecture.md
  - Быстрый старт: setup/quickstart.md
  - Конфигурация: setup/configuration.md
  - База данных: setup/database.md
  - Модули:
    - «Тундук»: приём и личное дело: modules/tunduk.md
    - Портал онбординга и справочник: modules/onboarding-portal.md
    - Кадровые процессы: табель и записки: modules/hr-processes.md
  - Справочник API:
    - Обзор: api/overview.md
    - Маршруты приложения: api/web-routes.md
    - Аутентификация: api/authentication.md
    - Сотрудники: api/employees.md
    - Опросы: api/surveys.md
    - Аналитика: api/analytics.md
  - Дополнение к ТЗ: tz/StaffSense_TZ_ADDENDUM_V1_1.md
  - Backlog и решения: BACKLOG.md
  - Отчёты:
    - Трассируемость FR/NFR: reports/TZ_TRACEABILITY_FR_NFR.md
    - Трассируемость BR/ERR/SCREEN: reports/TZ_TRACEABILITY_BR_ERR.md
    - Discovery-отчёт: reports/StaffSense_DISCOVERY_REPORT.md
    - Состояние Discovery: reports/STAFFSENSE_DISCOVERY_STATE.md
    - Формулы и метрики: reports/StaffSense_FORMULAS_EXPLAINED.md
    - Концепция «Тундук» и онбординга: reports/StaffSense_CONCEPT_TUNDUK_ONBOARDING.md
    - Оценка эпика E-08 «AI Skill Hub»: reports/AI_SKILL_HUB_ASSESSMENT.md
  - Развёртывание: deployment.md

plugins:
  - search

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
